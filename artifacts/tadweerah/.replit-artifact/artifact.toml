kind = "web"
previewPath = "/"
title = "Tadweerah"
version = "1.0.0"
id = "artifacts/tadweerah"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21331

[services.development]
run = "pnpm --filter @workspace/tadweerah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tadweerah", "run", "build" ]
publicDir = "artifacts/tadweerah/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21331"
BASE_PATH = "/"
