openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tadweerah API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user
  - name: companies
    description: Company management
  - name: listings
    description: Waste listings (M2)
  - name: offers
    description: Listing offers / bidding (M4)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current authenticated user and their company (if any)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
  /companies:
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a company for the current user (one company per user in MVP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "409":
          description: User already has a company

  /listings:
    get:
      operationId: listMarketplaceListings
      tags: [listings]
      summary: Public marketplace listings (open status only). Buyers browse here.
      parameters:
        - in: query
          name: material
          schema:
            $ref: "#/components/schemas/WasteMaterial"
        - in: query
          name: city
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WasteListing"
        "401":
          description: Unauthorized
        "403":
          description: Buyer access required
    post:
      operationId: createWasteListing
      tags: [listings]
      summary: Create a waste listing for the current producer company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWasteListingBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteListing"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Producer access required

  /listings/mine:
    get:
      operationId: listMyListings
      tags: [listings]
      summary: Listings owned by the current producer company
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/WasteListingStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WasteListing"
        "401":
          description: Unauthorized
        "403":
          description: Producer access required

  /listings/{waste_listing_id}:
    get:
      operationId: getWasteListing
      tags: [listings]
      summary: Get a single listing by id
      parameters:
        - in: path
          name: waste_listing_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteListing"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /listings/{waste_listing_id}/close:
    post:
      operationId: closeWasteListing
      tags: [listings]
      summary: Close a listing (owner producer only)
      parameters:
        - in: path
          name: waste_listing_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteListing"
        "401":
          description: Unauthorized
        "403":
          description: Not the owner
        "404":
          description: Not found

  /listings/{waste_listing_id}/offers:
    get:
      operationId: getListingOffers
      tags: [offers]
      summary: >
        Get offers for a listing.
        Producer (owner) sees all with buyer identity.
        Buyer sees only their own offer.
      parameters:
        - in: path
          name: waste_listing_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListingOffer"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: submitOffer
      tags: [offers]
      summary: Submit a first offer on an open listing (buyer only)
      parameters:
        - in: path
          name: waste_listing_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOfferBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingOffer"
        "400":
          description: Validation error or price too low
        "401":
          description: Unauthorized
        "403":
          description: Buyer access required
        "409":
          description: Offer already exists (use PUT to improve)

  /listings/{waste_listing_id}/offers/mine:
    put:
      operationId: improveOffer
      tags: [offers]
      summary: >
        Improve an existing pending offer.
        New price must exceed both the buyer's current price and the current highest offer.
      parameters:
        - in: path
          name: waste_listing_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOfferBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingOffer"
        "400":
          description: Validation error or price not high enough
        "401":
          description: Unauthorized
        "403":
          description: Buyer access required
        "404":
          description: No existing offer to improve

  /listings/{waste_listing_id}/offers/summary:
    get:
      operationId: getOffersSummary
      tags: [offers]
      summary: >
        Get offer count and highest price (amount only, no identity).
        Available to all authenticated company users.
      parameters:
        - in: path
          name: waste_listing_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OffersSummary"
        "401":
          description: Unauthorized

  /offers/mine:
    get:
      operationId: listMyOffers
      tags: [offers]
      summary: >
        List all offers submitted by the current buyer, with listing details.
        Ordered by offer.updated_at DESC (most recently changed first).
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/OfferStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyOffer"
        "401":
          description: Unauthorized
        "403":
          description: Buyer access required

  /offers/{offer_id}/accept:
    post:
      operationId: acceptOffer
      tags: [offers]
      summary: >
        Accept an offer (listing owner / producer only).
        Atomically: marks offer accepted, rejects all others, closes the listing.
        If accepted offer price < current highest pending, acceptance_reason is required.
      parameters:
        - in: path
          name: offer_id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptOfferBody"
      responses:
        "200":
          description: Offer accepted and listing closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingOffer"
        "401":
          description: Unauthorized
        "403":
          description: Not the listing owner
        "404":
          description: Offer not found
        "409":
          description: Offer not in pending state or listing already closed

  /offers/{offer_id}/reject:
    post:
      operationId: rejectOffer
      tags: [offers]
      summary: Reject a single pending offer (listing owner / producer only). rejection_reason is required.
      parameters:
        - in: path
          name: offer_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOfferBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingOffer"
        "401":
          description: Unauthorized
        "403":
          description: Not the listing owner
        "404":
          description: Offer not found
        "409":
          description: Offer not in pending state

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    CompanyType:
      type: string
      enum: [producer, buyer, carrier]
      description: producer = waste producer, buyer = recycling company, carrier = transporter
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/CompanyType"
        city:
          type: string
        commercialRegistration:
          type: string
        contactPhone:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, type, city, contactPhone, createdAt]
    CreateCompanyBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        type:
          $ref: "#/components/schemas/CompanyType"
        city:
          type: string
          minLength: 2
          maxLength: 80
        commercialRegistration:
          type: string
          maxLength: 40
        contactPhone:
          type: string
          minLength: 6
          maxLength: 20
      required: [name, type, city, contactPhone]
    MeResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        company:
          oneOf:
            - $ref: "#/components/schemas/Company"
            - type: "null"
      required: [userId]

    WasteMaterial:
      type: string
      enum: [paper, plastic, metal, glass, electronics, organic, other]
    WasteUnit:
      type: string
      enum: [kg, ton]
    WasteListingStatus:
      type: string
      enum: [open, closed]
    PricingModel:
      type: string
      enum: [fixed, by_weight]
      description: |
        Governs how price_per_unit is interpreted and what settlement mechanics apply.
        Immutable once a listing is published — producers must close and re-list to change model.
        fixed: price_per_unit × quantity = agreed commercial amount (current MVP).
        by_weight: price_per_unit is a rate; final amount settled post-weighing (future).
    WasteListing:
      type: object
      properties:
        id:
          type: string
        company_id:
          type: string
        company_name:
          type: string
        material:
          $ref: "#/components/schemas/WasteMaterial"
        quantity:
          type: number
        unit:
          $ref: "#/components/schemas/WasteUnit"
        city:
          type: string
        description:
          type: string
        price_hint:
          type: number
        status:
          $ref: "#/components/schemas/WasteListingStatus"
        pricing_model:
          $ref: "#/components/schemas/PricingModel"
          description: |
            Immutable once published. Defaults to "fixed" for the current MVP.
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        offer_count:
          type: integer
          description: Total number of offers on this listing (included for producer my-listings and marketplace M3)
        highest_offer_total:
          type: number
          description: Highest offer as a total (price_per_unit × quantity). Null if no offers.
      required:
        [id, company_id, company_name, material, quantity, unit, city, status, created_at]
    OfferStatus:
      type: string
      enum: [pending, accepted, rejected]
    ListingOffer:
      type: object
      properties:
        id:
          type: string
        waste_listing_id:
          type: string
        buyer_company_id:
          type: string
        buyer_company_name:
          type: string
        price_per_unit:
          type: number
        message:
          type: string
        status:
          $ref: "#/components/schemas/OfferStatus"
        rejection_reason:
          type: string
          description: Reason provided by producer when rejecting. Visible to the affected buyer only.
        rank:
          type: integer
          description: Buyer rank among all offers (1 = highest). Only included in buyer-facing responses.
        total_offers:
          type: integer
          description: Total number of offers on this listing. Included alongside rank.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
      required: [id, waste_listing_id, buyer_company_id, buyer_company_name, price_per_unit, status, created_at, updated_at]

    SubmitOfferBody:
      type: object
      properties:
        price_per_unit:
          type: number
          exclusiveMinimum: 0
        message:
          type: string
          maxLength: 500
      required: [price_per_unit]

    RejectOfferBody:
      type: object
      description: Required body when rejecting an offer. rejection_reason must be one of the predefined options.
      properties:
        rejection_reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Short reason code or label for the rejection
        rejection_reason_detail:
          type: string
          maxLength: 300
          description: Optional free-text detail when rejection_reason is 'other'
      required: [rejection_reason]

    AcceptOfferBody:
      type: object
      description: >
        Optional body when accepting an offer.
        acceptance_reason is REQUIRED (enforced by business logic) when the accepted offer
        price is lower than the current highest pending offer on the same listing.
      properties:
        acceptance_reason:
          type: string
          maxLength: 300

    OffersSummary:
      type: object
      properties:
        count:
          type: integer
        highest_price:
          type: number
      required: [count]

    MyOffer:
      type: object
      description: >
        A buyer's offer enriched with listing context. Used for the My Participations page.
      properties:
        id:
          type: string
        waste_listing_id:
          type: string
        listing_ref:
          type: string
          description: Human-readable reference e.g. "#LIST-ABCD12"
        listing_material:
          $ref: "#/components/schemas/WasteMaterial"
        listing_quantity:
          type: number
        listing_unit:
          $ref: "#/components/schemas/WasteUnit"
        listing_city:
          type: string
        listing_status:
          $ref: "#/components/schemas/WasteListingStatus"
        listing_company_name:
          type: string
          description: Producer's company name
        listing_closed_at:
          type: string
          format: date-time
        price_per_unit:
          type: number
        message:
          type: string
        status:
          $ref: "#/components/schemas/OfferStatus"
        rejection_reason:
          type: string
          description: Visible to this buyer only when their offer was rejected
        rank:
          type: integer
          description: Buyer's current rank (1 = highest). Only meaningful when status = pending
        total_offers:
          type: integer
        listing_accepted_total:
          type: number
          description: >
            Total value of the accepted offer (accepted_price_per_unit × listing_quantity).
            Included for rejected buyers when the listing is closed, so they can see the final price.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
      required:
        [ id, waste_listing_id, listing_ref, listing_material, listing_quantity, listing_unit,
          listing_city, listing_status, listing_company_name, price_per_unit, status,
          created_at, updated_at ]

    CreateWasteListingBody:
      type: object
      properties:
        material:
          $ref: "#/components/schemas/WasteMaterial"
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          $ref: "#/components/schemas/WasteUnit"
        city:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 500
        price_hint:
          type: number
          minimum: 0
        pricing_model:
          $ref: "#/components/schemas/PricingModel"
          description: |
            Governs settlement mechanics. Immutable once published.
            Defaults to "fixed" if not supplied. Must not be updated after creation.
      required: [material, quantity, unit, city]
